name: TELEPAT Modal Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/modal-smoke-trigger"
  workflow_run:
    workflows: ["TELEPAT Modal Deploy"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: telepat-modal-smoke-v2
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Real provider smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TELEPAT_ATTACH_PROVIDER_SECRET: "0"
      TELEPAT_AVATAR_GPU_ENABLED: ${{ secrets.TELEPAT_AVATAR_GPU_ENABLED || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install "modal>=1.6,<2"

      - name: Detect TELEPAT provider secret
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          test -n "$CLEAN_ID"
          test -n "$CLEAN_SECRET"

          MODAL_TOKEN_ID="$CLEAN_ID" MODAL_TOKEN_SECRET="$CLEAN_SECRET" \
            python -m modal secret list --json > modal-secrets.json

          python - <<'PY'
          import json, os

          with open("modal-secrets.json", encoding="utf-8") as fh:
              data = json.load(fh)

          def contains_name(value):
              if isinstance(value, dict):
                  if value.get("name") == "quantareon-telepat-secrets":
                      return True
                  return any(contains_name(item) for item in value.values())
              if isinstance(value, list):
                  return any(contains_name(item) for item in value)
              return value == "quantareon-telepat-secrets"

          attach = contains_name(data)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(
                  "TELEPAT_ATTACH_PROVIDER_SECRET="
                  + ("1" if attach else "0")
                  + "\n"
              )
          print("Provider secret:", "attached" if attach else "not present")
          PY

      - name: Run deployed TELEPAT provider probe
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          MODAL_TOKEN_ID="$CLEAN_ID" MODAL_TOKEN_SECRET="$CLEAN_SECRET" \
            timeout 300s python deploy/run_provider_probe.py

      - name: Probe TELEPAT avatar GPU worker
        if: env.TELEPAT_AVATAR_GPU_ENABLED == '1' || env.TELEPAT_AVATAR_GPU_ENABLED == 'true'
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          MODAL_TOKEN_ID="$CLEAN_ID" MODAL_TOKEN_SECRET="$CLEAN_SECRET" \
            timeout 180s python deploy/run_avatar_probe.py

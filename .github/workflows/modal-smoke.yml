name: TELEPAT Modal Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/modal-smoke-trigger"

permissions:
  contents: read

concurrency:
  group: telepat-modal-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Real provider smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require Modal GitHub secrets
        shell: bash
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Missing repository secrets MODAL_TOKEN_ID and/or MODAL_TOKEN_SECRET."
            echo "::error::Add them in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Validate Modal credential presence
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          echo "Modal credentials are present."

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install "modal>=1.6,<2"

      - name: Verify Modal authentication
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          test -n "$CLEAN_ID"
          test -n "$CLEAN_SECRET"
          MODAL_TOKEN_ID="$CLEAN_ID" MODAL_TOKEN_SECRET="$CLEAN_SECRET" python -m modal token info

      - name: Run TELEPAT provider smoke
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          MODAL_TOKEN_ID="$CLEAN_ID" MODAL_TOKEN_SECRET="$CLEAN_SECRET" python -m modal run deploy/smoke.py

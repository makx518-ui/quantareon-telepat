name: TELEPAT Modal Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/modal-smoke-trigger"
  workflow_run:
    workflows: ["TELEPAT Modal Deploy"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: telepat-modal-smoke-v2
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Real provider smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TELEPAT_AVATAR_GPU_ENABLED: ${{ secrets.TELEPAT_AVATAR_GPU_ENABLED || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install "modal>=1.6,<2"

      - name: Normalize Modal auth
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          test -n "$CLEAN_ID"
          test -n "$CLEAN_SECRET"
          echo "::add-mask::$CLEAN_ID"
          echo "::add-mask::$CLEAN_SECRET"
          echo "MODAL_TOKEN_ID=$CLEAN_ID" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$CLEAN_SECRET" >> "$GITHUB_ENV"

      - name: Run deployed TELEPAT provider probe
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          MODAL_TOKEN_ID="$CLEAN_ID" MODAL_TOKEN_SECRET="$CLEAN_SECRET" \
            timeout 300s python deploy/run_provider_probe.py

      - name: Probe TELEPAT avatar GPU worker
        if: env.TELEPAT_AVATAR_GPU_ENABLED == '1' || env.TELEPAT_AVATAR_GPU_ENABLED == 'true'
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          MODAL_TOKEN_ID="$CLEAN_ID" MODAL_TOKEN_SECRET="$CLEAN_SECRET" \
            timeout 180s python deploy/run_avatar_probe.py

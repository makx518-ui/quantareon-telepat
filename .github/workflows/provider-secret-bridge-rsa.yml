name: TELEPAT Secure Provider Bridge RSA

on:
  push:
    branches: [main]
    paths:
      - ".github/provider-bridge-rsa-trigger"

permissions:
  contents: write

concurrency:
  group: telepat-secure-provider-bridge-rsa
  cancel-in-progress: false

jobs:
  bridge:
    name: Install provider credentials into Modal with RSA
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bridge dependencies
        run: pip install "modal>=1.6,<2" "cryptography>=43,<47"

      - name: Publish ephemeral RSA public key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          private_key = rsa.generate_private_key(public_exponent=65537, key_size=4096)
          with open("/tmp/telepat-provider-bridge-rsa.private.pem", "wb") as fh:
              fh.write(
                  private_key.private_bytes(
                      serialization.Encoding.PEM,
                      serialization.PrivateFormat.PKCS8,
                      serialization.NoEncryption(),
                  )
              )
          with open(".github/provider-bridge-rsa.pub", "wb") as fh:
              fh.write(
                  private_key.public_key().public_bytes(
                      serialization.Encoding.PEM,
                      serialization.PublicFormat.SubjectPublicKeyInfo,
                  )
              )
          PY

          git config user.name "TELEPAT Provider Bridge"
          git config user.email "telepat-provider-bridge@users.noreply.github.com"
          git add .github/provider-bridge-rsa.pub
          git commit -m "Publish ephemeral TELEPAT RSA bridge key"
          git push origin HEAD:main

      - name: Wait for encrypted provider bundle
        shell: bash
        run: |
          set -euo pipefail
          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/provider-secrets-rsa.enc?ref=main"
          FOUND=0
          for _ in $(seq 1 90); do
            CODE="$(curl -sS -o /tmp/provider-secrets-rsa-response.json -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "${URL}")"
            if [ "${CODE}" = "200" ]; then
              jq -r '.content' /tmp/provider-secrets-rsa-response.json \
                | tr -d '\n' \
                | base64 -d > /tmp/provider-secrets-rsa.enc
              FOUND=1
              break
            fi
            sleep 4
          done
          test "${FOUND}" = "1"
          test -s /tmp/provider-secrets-rsa.enc

      - name: Decrypt in memory and update Modal Secret
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          test -n "$CLEAN_ID"
          test -n "$CLEAN_SECRET"
          export MODAL_TOKEN_ID="$CLEAN_ID"
          export MODAL_TOKEN_SECRET="$CLEAN_SECRET"

          python - <<'PY'
          import base64
          import json

          import modal
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          expected = {
              "DEEPGRAM_API_KEY",
              "GEMINI_API_KEY",
              "GROQ_API_KEY",
              "YANDEX_SPEECHKIT_API_KEY",
          }

          with open("/tmp/telepat-provider-bridge-rsa.private.pem", "rb") as fh:
              private_key = serialization.load_pem_private_key(fh.read(), password=None)
          with open("/tmp/provider-secrets-rsa.enc", encoding="utf-8") as fh:
              ciphertext = base64.b64decode(fh.read().strip())

          plaintext = private_key.decrypt(
              ciphertext,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )
          values = json.loads(plaintext.decode("utf-8"))

          if set(values) != expected:
              raise SystemExit("Encrypted provider bundle has unexpected keys")
          if not all(isinstance(values[key], str) and values[key].strip() for key in expected):
              raise SystemExit("Encrypted provider bundle contains an empty value")

          modal.Secret.from_name("quantareon-telepat-secrets").update(
              {key: values[key].strip() for key in expected}
          )
          print("Installed 4 TELEPAT provider credentials into Modal Secret.")
          PY

      - name: Remove encrypted RSA bridge artifacts
        if: always()
        shell: bash
        run: |
          set +e
          git fetch origin main
          git reset --hard origin/main
          git config user.name "TELEPAT Provider Bridge"
          git config user.email "telepat-provider-bridge@users.noreply.github.com"
          git rm -f .github/provider-bridge-rsa.pub .github/provider-secrets-rsa.enc 2>/dev/null
          git diff --cached --quiet || git commit -m "Remove TELEPAT RSA provider bridge artifacts"
          git push origin HEAD:main
          exit 0

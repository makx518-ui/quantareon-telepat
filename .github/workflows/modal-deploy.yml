name: TELEPAT Modal Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/modal-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: telepat-modal-deploy-v2
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy TELEPAT API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TELEPAT_ATTACH_PROVIDER_SECRET: "0"
      TELEPAT_REGISTER_GPU: "0"
      TELEPAT_BUILD_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install "modal>=1.6,<2" "websockets>=12,<16"

      - name: Detect TELEPAT provider secret
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          MODAL_TOKEN_ID="$CLEAN_ID" MODAL_TOKEN_SECRET="$CLEAN_SECRET" \
            python -m modal secret list --json > modal-secrets.json

          python - <<'PY'
          import json, os

          with open("modal-secrets.json", encoding="utf-8") as fh:
              data = json.load(fh)

          def contains_name(value):
              if isinstance(value, dict):
                  if value.get("name") == "quantareon-telepat-secrets":
                      return True
                  return any(contains_name(item) for item in value.values())
              if isinstance(value, list):
                  return any(contains_name(item) for item in value)
              return value == "quantareon-telepat-secrets"

          attach = contains_name(data)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(
                  "TELEPAT_ATTACH_PROVIDER_SECRET="
                  + ("1" if attach else "0")
                  + "\n"
              )
          print("Provider secret:", "attached" if attach else "not present")
          PY

      - name: Deploy TELEPAT
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          test -n "$CLEAN_ID"
          test -n "$CLEAN_SECRET"

          MODAL_TOKEN_ID="$CLEAN_ID" MODAL_TOKEN_SECRET="$CLEAN_SECRET" \
            python -m modal deploy deploy/modal_app.py 2>&1 | tee modal-deploy.log

          ENDPOINT="$(grep -Eo 'https://[A-Za-z0-9._-]+\.modal\.run' modal-deploy.log | head -n1 || true)"
          if [ -z "$ENDPOINT" ]; then
            echo "::error::Modal deploy completed without a discoverable endpoint URL."
            exit 1
          fi

          echo "TELEPAT_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          echo "Endpoint discovered."

      - name: Modal app info
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          MODAL_TOKEN_ID="$CLEAN_ID" MODAL_TOKEN_SECRET="$CLEAN_SECRET" \
            python -m modal app info quantareon-telepat --no-color

      - name: Live API smoke
        id: live_smoke
        continue-on-error: true
        run: timeout 180s python deploy/live_api_smoke.py

      - name: Live voice WebSocket smoke
        id: voice_smoke
        continue-on-error: true
        run: timeout 180s python deploy/live_voice_smoke.py

      - name: Live core concurrency smoke
        id: load_smoke
        continue-on-error: true
        run: timeout 240s python deploy/live_load_smoke.py

      - name: Modal stderr diagnostics
        if: steps.live_smoke.outcome == 'failure' || steps.voice_smoke.outcome == 'failure' || steps.load_smoke.outcome == 'failure'
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          MODAL_TOKEN_ID="$CLEAN_ID" MODAL_TOKEN_SECRET="$CLEAN_SECRET" \
            python -m modal app logs quantareon-telepat --tail 200 --source stderr --timestamps || true

      - name: Enforce live smoke
        if: steps.live_smoke.outcome == 'failure' || steps.voice_smoke.outcome == 'failure' || steps.load_smoke.outcome == 'failure'
        run: exit 1

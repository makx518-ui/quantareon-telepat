name: TELEPAT SkyReels V3 Sample

on:
  push:
    branches: [main]
    paths:
      - ".github/skyreels-v3-sample-trigger"

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Modal
        run: pip install "modal>=1.6,<2"
      - name: Render 5s SkyReels sample
        run: python -m deploy.run_skyreels_v3 sample-public --duration 5 --resolution 480P --output skyreels-v3-sample-5s.mp4
      - name: Upload sample
        uses: actions/upload-artifact@v4
        with:
          name: telepat-skyreels-v3-sample-5s
          path: skyreels-v3-sample-5s.mp4
          if-no-files-found: error
          retention-days: 14

name: TELEPAT Avatar GPU Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/avatar-gpu-preflight-trigger"

permissions:
  contents: read

concurrency:
  group: telepat-avatar-gpu-preflight
  cancel-in-progress: true

jobs:
  probe:
    name: Probe TELEPAT L4 avatar worker
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal CLI
        run: pip install "modal>=1.6,<2"

      - name: Normalize Modal auth
        shell: bash
        run: |
          CLEAN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)"
          CLEAN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)"
          test -n "$CLEAN_ID"
          test -n "$CLEAN_SECRET"
          echo "::add-mask::$CLEAN_ID"
          echo "::add-mask::$CLEAN_SECRET"
          echo "MODAL_TOKEN_ID=$CLEAN_ID" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$CLEAN_SECRET" >> "$GITHUB_ENV"

      - name: Deploy avatar GPU boundary
        run: python -m modal deploy deploy/avatar_gpu.py

      - name: Probe L4 hardware and benchmark assets
        run: timeout 600s python deploy/run_avatar_probe.py

name: TELEPAT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: telepat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Compile
        run: |
          python -m compileall -q telepat deploy main.py

      - name: Test
        env:
          TELEPAT_CONVERSATION_PROVIDER: mock
        run: pytest -q

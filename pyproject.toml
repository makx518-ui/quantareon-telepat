[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantareon-telepat"
version = "0.5.0"
description = "QUANTAREON TELEPAT — live AI astropsychologist"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["telepat*", "deploy*"]

[tool.setuptools.package-data]
"telepat.astro.engine" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
